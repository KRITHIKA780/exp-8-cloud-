<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report lost item | FindBack</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav>
    <a class="brand" href="index.html">FindBack</a>
    <div data-nav-links></div>
  </nav>
  <main class="form-page">
    <section class="form-card wide">
      <div class="form-intro">
        <div><p class="eyebrow">STEP 1 · STUDENT REPORT</p><h1>What did you lose?</h1><p class="lead">Admin will be notified as soon as you submit this. Include a photo and where it was missed.</p></div>
        <span class="form-badge">ADMIN ALERTS ON</span>
      </div>
      <div class="status-rail" aria-label="Lost item flow"><div class="current">Report</div><div>Search</div><div>Claim</div><div>Return</div></div>
      <form data-report="lost" enctype="multipart/form-data">
        <label>Item name<input name="title" placeholder="e.g. Silver watch" required></label>
        <label>Description<textarea name="description" placeholder="Colour, brand, any unique marks..." required></textarea></label>
        <div class="two-col">
          <label>Category<input name="category" placeholder="Accessories" required></label>
          <label>Where it was missed<input name="location" placeholder="Library, Block A" required></label>
        </div>
        <label>Photo of item<input name="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp" required></label>
        <button class="button" type="submit">Notify admin & publish</button>
        <p class="form-message"></p>
      </form>
    </section>
  </main>
  <script src="../js/auth.js"></script>
  <script src="../js/items.js"></script>
</body>
</html>
